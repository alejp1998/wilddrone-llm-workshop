[project]
name = "wilddrone-llm-workshop"
version = "1.3.0"
description = "Hands-on LLM agent workshop: natural language control of a drone safari game."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # imports after sys.path tweaks
