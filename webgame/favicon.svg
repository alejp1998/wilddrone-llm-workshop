<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White rounded card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <!-- Rotor arms -->
  <g stroke="#0F172A" stroke-width="3.2" stroke-linecap="round">
    <line x1="27" y1="30" x2="16" y2="16"/>
    <line x1="37" y1="30" x2="48" y2="16"/>
    <line x1="27" y1="34" x2="16" y2="48"/>
    <line x1="37" y1="34" x2="48" y2="48"/>
  </g>
  <!-- Propellers (spinning blade arcs) -->
  <g fill="#0F172A">
    <path d="M 10 16 A 6 6 0 1 1 16 10 A 4.5 4.5 0 1 0 10 16 Z"/>
    <path d="M 48 10 A 6 6 0 1 1 54 16 A 4.5 4.5 0 1 0 48 10 Z"/>
    <path d="M 10 48 A 6 6 0 1 0 16 54 A 4.5 4.5 0 1 1 10 48 Z"/>
    <path d="M 48 54 A 6 6 0 1 0 54 48 A 4.5 4.5 0 1 1 48 54 Z"/>
    <circle cx="16" cy="16" r="1.6"/>
    <circle cx="48" cy="16" r="1.6"/>
    <circle cx="16" cy="48" r="1.6"/>
    <circle cx="48" cy="48" r="1.6"/>
  </g>
  <!-- Drone body -->
  <rect x="24" y="27.5" width="16" height="9" rx="3" fill="#0F172A"/>
  <!-- Camera lens (the safari photo theme) -->
  <circle cx="32" cy="32" r="5.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="2.6" fill="#0F172A"/>
  <circle cx="31.2" cy="31.2" r="0.9" fill="#FFFFFF"/>
</svg>
