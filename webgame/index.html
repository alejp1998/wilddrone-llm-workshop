<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Safari — Wild Drone LLM Workshop Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" href="favicon.png" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var theme =
          saved ||
          (window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <g stroke="#0F172A" stroke-width="1.6" stroke-linecap="round">
              <line x1="10" y1="11.5" x2="6" y2="6.5" />
              <line x1="14" y1="11.5" x2="18" y2="6.5" />
              <line x1="10" y1="12.5" x2="6" y2="17.5" />
              <line x1="14" y1="12.5" x2="18" y2="17.5" />
            </g>
            <path
              d="M5 6.5 A2.5 2.5 0 1 1 6.5 5 A 1.9 1.9 0 1 0 5 6.5 Z"
              fill="#0F172A"
            />
            <path
              d="M17.5 5 A2.5 2.5 0 1 1 19 6.5 A 1.9 1.9 0 1 0 17.5 5 Z"
              fill="#0F172A"
            />
            <path
              d="M5 17.5 A2.5 2.5 0 1 0 6.5 19 A 1.9 1.9 0 1 1 5 17.5 Z"
              fill="#0F172A"
            />
            <path
              d="M17.5 19 A2.5 2.5 0 1 0 19 17.5 A 1.9 1.9 0 1 1 17.5 19 Z"
              fill="#0F172A"
            />
            <rect
              x="9"
              y="10.4"
              width="6"
              height="3.2"
              rx="1.2"
              fill="#0F172A"
            />
            <circle
              cx="12"
              cy="12"
              r="1.9"
              fill="#FFFFFF"
              stroke="#0F172A"
              stroke-width="1.1"
            />
            <circle cx="12" cy="12" r="0.8" fill="#0F172A" />
          </svg>
        </div>
        <div>
          <div class="brand-title">Drone Safari</div>
          <div class="brand-sub">Wild Drone LLM Workshop · PixiJS edition</div>
        </div>
      </div>
      <div class="header-actions">
        <select id="difficulty" class="btn" title="Difficulty">
          <option value="easy">🟢 Easy</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="hard">🔴 Hard</option>
        </select>
        <button class="btn" id="btn-restart">↻ Restart</button>
        <button class="btn" id="btn-theme">🌙/☀️ Theme</button>
      </div>
    </header>

    <main>
      <section class="stage">
        <div id="pixi-stage"></div>
        <div class="hint">
          ↑↓ move · ←→ turn · Space/Enter photo · R restart · Q quit
        </div>
      </section>

      <aside class="sidebar">
        <section class="panel" id="hud">
          <div class="panel-title">🎯 Mission</div>
          <div class="hud-row">
            <span>Position</span><b id="hud-pos">6, 6</b>
          </div>
          <div class="hud-row">
            <span>Facing</span><b id="hud-facing">North</b>
          </div>
          <div class="hud-row"><span>Pictures</span><b id="hud-pics">5</b></div>
          <div class="hud-row">
            <span>Moves / Turns</span><b id="hud-moves">0 / 0</b>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title">📸 Safari Album</div>
          <div class="album">
            <div class="album-item" id="album-zebra"><span>🦓</span> Zebra</div>
            <div class="album-item" id="album-elephant">
              <span>🐘</span> Elephant
            </div>
            <div class="album-item" id="album-oryx"><span>🦌</span> Oryx</div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title">🎮 Controls</div>
          <div class="controls">
            <div class="ctrl-grid">
              <button class="ctrl" data-action="turn-left">◀</button>
              <button class="ctrl ctrl-main" data-action="move-forward">
                ▲
              </button>
              <button class="ctrl" data-action="turn-right">▶</button>
              <button class="ctrl" data-action="move-backward">▼</button>
              <button class="ctrl ctrl-shot" data-action="picture">📷</button>
            </div>
            <button class="btn btn-add" id="btn-sensors">🔋 Sensors</button>
          </div>
        </section>

        <section class="panel log-panel">
          <div class="panel-title">📡 Flight Log</div>
          <div id="log"></div>
        </section>
      </aside>
    </main>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <div id="overlay-emoji">🏆</div>
        <h2 id="overlay-title">Game Over</h2>
        <p id="overlay-sub">Press R or click Restart to fly again.</p>
        <button class="btn btn-add" id="btn-overlay-restart">
          ↻ Fly Again
        </button>
      </div>
    </div>

    <script src="https://pixijs.download/release/pixi.min.js"></script>
    <script src="js/game-core.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
